name: Voxzen Publish

# Voxzen fork: 发布 skiko artifacts 到 GitHub Packages(https://maven.pkg.github.com/zeshipalace/skiko)
# 手动触发。发布前必须先递增 skiko/gradle.properties 中 deploy.version 的 -voxzen.N 尾号,
# GitHub Packages 不允许覆盖已存在的版本。
#
# - linux 作业:发布全部 Linux 可建产物(skiko 主模块、skiko-awt、linux-x64 runtime 等)
# - windows 作业:只发布 Windows 独有的 runtime,避免与 linux 作业重复推送 skiko-awt
#
# 两个作业完成后,Voxzen 侧更新 gradle.properties 的 voxzen.skiko.version 即可全平台使用。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-linux:
    name: 'Publish (Linux)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - shell: bash
        name: 'Publish all Linux-built artifacts to GitHub Packages'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -p skiko --no-daemon --stacktrace \
            -Pdeploy.release=true \
            publishToVoxzenGitHubPackages

  publish-windows-runtime:
    name: 'Publish Windows runtime'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      # 只发布 Windows 独有的 runtime;skiko-awt 等公共产物由 linux 作业发布
      - shell: bash
        name: 'Publish Windows runtime to GitHub Packages'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -p skiko --no-daemon --stacktrace \
            -Pdeploy.release=true \
            publishSkikoJvmRuntimeWindowsX64PublicationToVoxzenGitHubPackagesRepository
